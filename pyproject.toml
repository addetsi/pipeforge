[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeforge"
description = "A data pipeline CLI tool"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.3",
    "pyarrow>=16.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
pipeforge = "pipeforge.cli:app"

[tool.hatch.version]
path = "src/pipeforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeforge"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pipeforge --cov-report=term-missing"
